plugins {
    id 'java'
    id 'org.jetbrains.intellij' version '1.17.4'
}

group = 'com.hlsl'
version = '1.11.6'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

intellij {
    version = '2024.1'
    type = 'IC'
    // CLion-specific plugins not needed for syntax highlighting;
    // using IntelliJ Community (IC) for broader compatibility.
}

tasks {
    patchPluginXml {
        sinceBuild = '241'
        untilBuild = '261.*'
    }

    buildSearchableOptions {
        enabled = false
    }

    test {
        // The real shader sources used as fixtures are not in the repository (private project, git-ignored),
        // so the tests that need them are skipped unless the sources are provided.
        def shaderSources = System.getenv('HLSL_TEST_SOURCE_DIR')
        def fixturesPresent = (shaderSources != null && !shaderSources.isBlank())
                ? file(shaderSources).isDirectory()
                : file('src/test/resources/dx12').isDirectory() || file('src/test/resources/samples').isDirectory()
        if (!fixturesPresent) {
            filter {
                excludeTestsMatching '*HlslRealShaderTest'
                excludeTestsMatching '*HlslSampleShaderTest'
                excludeTestsMatching '*HlslCompletionContributorTest'
                excludeTestsMatching '*HlslCompletionInIdeTest'
                excludeTestsMatching '*HlslParameterInfoTest'
                excludeTestsMatching '*HlslDocumentationTest'
            }
        }
    }
}
