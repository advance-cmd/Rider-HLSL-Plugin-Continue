# HLSL 内建函数与内建类型的中文说明，鼠标悬停时显示，也写在生成的内建声明文件里每个声明的上方。
# 英文原文在 builtins.properties，声明本身在 builtins.hlsl。

header = HLSL 的内建函数和内建类型。它们由编译器提供，这个文件只是把它们声明出来，\n\
  让悬停说明和“转到声明”有内容可看。本文件由 HLSL 插件生成，只读。\n\
  T 表示标量、向量或矩阵类型。带偏移量或状态参数的重载没有列出。
kind.function = 内建函数
kind.type = 内建类型
kind.attribute = 属性

# 纹理
Texture1D = 只读一维纹理，绑定到 t 寄存器。T 是 Sample 和 Load 返回的类型，省略时为 float4。
Texture1DArray = 只读一维纹理数组，绑定到 t 寄存器。坐标的最后一个分量是数组层索引。
Texture2D = 只读二维纹理，绑定到 t 寄存器。通过 SamplerState 采样，或用 Load 和 [] 按纹素读取。
Texture2DArray = 只读二维纹理数组，绑定到 t 寄存器。坐标的最后一个分量是数组层索引。
Texture3D = 只读三维（体积）纹理，绑定到 t 寄存器。
TextureCube = 只读立方体贴图，绑定到 t 寄存器。用方向向量而不是纹理坐标采样。
TextureCubeArray = 只读立方体贴图数组，绑定到 t 寄存器。坐标的第四个分量选择第几个立方体。
Texture2DMS = 只读多重采样二维纹理，绑定到 t 寄存器。不能采样，每个样本用 Load 读取。
Texture2DMSArray = 只读多重采样二维纹理数组，绑定到 t 寄存器。每个样本用 Load 读取。
RWTexture1D = 可读写一维纹理（UAV），绑定到 u 寄存器。用 [] 读写纹素。
RWTexture1DArray = 可读写一维纹理数组（UAV），绑定到 u 寄存器。
RWTexture2D = 可读写二维纹理（UAV），绑定到 u 寄存器。用 [] 读写纹素；不能采样，原子操作通过 Interlocked 系列函数完成。
RWTexture2DArray = 可读写二维纹理数组（UAV），绑定到 u 寄存器。
RWTexture3D = 可读写三维纹理（UAV），绑定到 u 寄存器。

# 缓冲
Buffer = 只读类型化缓冲，绑定到 t 寄存器。每个元素按视图的格式转换为 T。
RWBuffer = 可读写类型化缓冲（UAV），绑定到 u 寄存器。
StructuredBuffer = 只读结构化缓冲，元素是结构体 T，绑定到 t 寄存器。
RWStructuredBuffer = 可读写结构化缓冲（UAV），元素是结构体 T，绑定到 u 寄存器。可以附带一个隐藏计数器。
AppendStructuredBuffer = 只写的结构化缓冲，当作栈使用：Append 压入一个元素。绑定到 u 寄存器。
ConsumeStructuredBuffer = 当作栈读取的结构化缓冲：Consume 弹出一个元素。绑定到 u 寄存器。
ByteAddressBuffer = 只读原始缓冲，按字节寻址，绑定到 t 寄存器。地址必须是 4 的倍数。
RWByteAddressBuffer = 可读写原始缓冲（UAV），按字节寻址，绑定到 u 寄存器。支持对 32 位字做原子操作。
ConstantBuffer = 布局为结构体 T 的常量缓冲，绑定到 b 寄存器。直接读取成员，不需要 cbuffer 块。

# 采样器与其他对象
SamplerState = 采样器，描述纹理采样时的过滤和寻址方式，绑定到 s 寄存器。
SamplerComparisonState = 比较采样器，供 SampleCmp 和 GatherCmp 使用，常用于阴影贴图。绑定到 s 寄存器。
InputPatch = 外壳着色器（hull shader）收到的一个面片的控制点；ControlPointCount 是面片大小。
OutputPatch = 外壳着色器输出的控制点，供面片常量函数和域着色器读取。
PointStream = 几何着色器输出点的流。
LineStream = 几何着色器输出线带的流。RestartStrip 开始一条新的带。
TriangleStream = 几何着色器输出三角形带的流。RestartStrip 开始一条新的带。
RaytracingAccelerationStructure = 顶层光线追踪加速结构，绑定到 t 寄存器，传给 TraceRay 使用。
RayDesc = 一条光线：起点、方向，以及沿光线接受命中的区间 [TMin, TMax]。
RayQuery = 内联光线追踪查询（Shader Model 6.5）：可在任意着色器阶段发射光线，用 Proceed 逐个处理候选命中。
ResourceDescriptorHeap = 着色器可见的资源描述符堆（Shader Model 6.6）。按索引取出资源，不需要寄存器绑定。
SamplerDescriptorHeap = 着色器可见的采样器描述符堆（Shader Model 6.6）。按索引取出采样器，不需要寄存器绑定。
vector = 通用向量类型：vector<float, 4> 就是 float4。不写模板参数时为 float4。
matrix = 通用矩阵类型：matrix<float, 4, 4> 就是 float4x4。不写模板参数时为 float4x4。
sampler = Direct3D 9 旧式采样器类型，与 tex* 系列函数配合使用。
sampler1D = Direct3D 9 旧式一维纹理采样器，配合 tex1D 使用。
sampler2D = Direct3D 9 旧式二维纹理采样器，配合 tex2D 使用。
sampler3D = Direct3D 9 旧式体积纹理采样器，配合 tex3D 使用。
samplerCUBE = Direct3D 9 旧式立方体贴图采样器，配合 texCUBE 使用。
texture = Direct3D 9 effect 旧式纹理类型，在 effect 文件里绑定到采样器。

# 数学
abs = 逐分量取绝对值。
acos = 逐分量求反余弦，结果为弧度。
asin = 逐分量求反正弦，结果为弧度。
atan = 逐分量求反正切，结果为弧度。
atan2 = 求 y / x 的反正切，根据两者的符号确定象限。结果在 [-π, π]。
cos = 逐分量求余弦，参数为弧度。
cosh = 逐分量求双曲余弦。
sin = 逐分量求正弦，参数为弧度。
sinh = 逐分量求双曲正弦。
sincos = 同时求 x 的正弦和余弦，分别写入 s 和 c。
tan = 逐分量求正切，参数为弧度。
tanh = 逐分量求双曲正切。
degrees = 弧度转角度。
radians = 角度转弧度。
ceil = 逐分量向上取整。
floor = 逐分量向下取整。
round = 逐分量四舍五入到最近的整数。
trunc = 去掉小数部分，向零取整。
frac = 逐分量取小数部分，即 x - floor(x)。
fmod = x / y 的浮点余数，符号与 x 相同。
modf = 把 x 拆成小数部分（返回值）和整数部分（写入 integerPart），两者都保留 x 的符号。
frexp = 把 x 拆成尾数（返回值）和以 2 为底的指数（写入 exponent）。
ldexp = 计算 x * 2^exponent。
exp = e 的 x 次方。
exp2 = 2 的 x 次方。
log = 自然对数。
log10 = 以 10 为底的对数。
log2 = 以 2 为底的对数。
pow = x 的 y 次方。x 为负数时结果未定义。
sqrt = 逐分量求平方根。
rsqrt = 平方根的倒数，即 1 / sqrt(x)。
rcp = 快速近似求倒数 1 / x。
min = 逐分量取 x 和 y 中较小的值。
max = 逐分量取 x 和 y 中较大的值。
clamp = 逐分量把 x 限制在 [min, max] 内。
saturate = 逐分量把 x 限制在 [0, 1] 内。
sign = 逐分量按 x 的符号返回 -1、0 或 1，类型为 int。
lerp = 线性插值 x + s * (y - x)：s = 0 得 x，s = 1 得 y。
smoothstep = x 从 min 变到 max 时，在 0 到 1 之间做平滑的 Hermite 插值。
step = 逐分量比较：x >= y 时为 1，否则为 0。
mad = 计算 m * a + b，编译为一条乘加指令。
fma = double 的融合乘加：a * b + c，只舍入一次。
all = x 的所有分量都非零时为 true。
any = x 有任一分量非零时为 true。
isfinite = 逐分量判断 x 既不是无穷大也不是 NaN。
isinf = 逐分量判断 x 是否为正无穷或负无穷。
isnan = 逐分量判断 x 是否为 NaN。

# 向量与矩阵
dot = 两个向量的点积。
cross = 两个三维向量的叉积。
length = 向量的长度。
distance = 两点之间的距离。
normalize = 把向量缩放到长度为 1。
reflect = 入射向量 i 关于表面法线 n 的反射向量。
refract = 入射向量 i 穿过法线为 n、折射率之比为 eta 的表面后的折射向量。发生全反射时为零向量。
faceforward = 计算 -n * sign(dot(i, ng))：翻转 n，使它朝向与入射向量相反的一侧。
mul = 矩阵乘法。向量在左边时视为行向量，在右边时视为列向量。
determinant = 方阵的行列式。
transpose = 矩阵转置：行变为列。
dst = 旧式光照用的距离向量：(1, a.y * b.y, a.z, b.w)。
lit = 根据 n·l、n·h 和高光指数 m 计算旧式光照系数（环境光、漫反射、高光、1）。
noise = Perlin 噪声。只有旧式 effect 纹理着色器能用，普通编译的着色器不能用。

# 位操作与类型转换
asfloat = 把 x 的二进制位按 float 解释，不做数值转换。
asint = 把 x 的二进制位按 int 解释，不做数值转换。
asuint = 把 x 的二进制位按 uint 解释。double 版本把值拆成高低两个 32 位。
asdouble = 由高低两个 32 位拼出一个 double。
f16tof32 = 把 value 低 16 位中的半精度浮点数转换为 float。
f32tof16 = 把 float 转为半精度，存放在结果的低 16 位。
D3DCOLORtoUBYTE4 = 把 float4 颜色转换为旧式 D3DCOLOR（UBYTE4）顶点格式的 4 个字节，分量顺序与 Direct3D 9 相同。
countbits = 逐分量统计为 1 的位数。
reversebits = 逐分量反转位序：第 0 位变成第 31 位。
firstbithigh = 最高位 1 的位置（从第 0 位算起）；对负的 int 则找最高位 0。找不到时返回 -1（0xFFFFFFFF）。
firstbitlow = 最低位 1 的位置。value 为 0 时返回 -1（0xFFFFFFFF）。
msad4 = 计算 4 字节参考值与 source 中四个字节窗口的带掩码绝对差之和，再加上 accumulator。参考值中为 0 的字节被跳过。

# 像素着色器
clip = x 的任一分量为负时丢弃当前像素。
ddx = x 沿屏幕 x 方向的变化率。仅限像素着色器。
ddx_coarse = 粗粒度 ddx：每个 2x2 像素块共用一个值。
ddx_fine = 细粒度 ddx：在 2x2 像素块内按每对像素分别计算。
ddy = x 沿屏幕 y 方向的变化率。仅限像素着色器。
ddy_coarse = 粗粒度 ddy：每个 2x2 像素块共用一个值。
ddy_fine = 细粒度 ddy：在 2x2 像素块内按每对像素分别计算。
fwidth = abs(ddx(x)) + abs(ddy(x))，即 x 在屏幕空间的变化量，常用于抗锯齿。
EvaluateAttributeAtCentroid = 在像素质心处计算输入属性的值。仅限像素着色器。
EvaluateAttributeAtSample = 在像素的指定样本位置计算输入属性的值。
EvaluateAttributeSnapped = 在像素中心偏移 offset 处计算输入属性的值，偏移以 1/16 像素为单位。
GetRenderTargetSampleCount = 当前绑定的渲染目标的采样数。
GetRenderTargetSamplePosition = 指定样本在像素内的位置。

# 同步
AllMemoryBarrier = 等待线程组的所有内存访问完成，包括设备内存和 groupshared 内存。
AllMemoryBarrierWithGroupSync = 同 AllMemoryBarrier，并且等待组内所有线程都执行到这里。
DeviceMemoryBarrier = 等待所有设备内存（缓冲和纹理）访问完成。
DeviceMemoryBarrierWithGroupSync = 同 DeviceMemoryBarrier，并且等待组内所有线程都执行到这里。
GroupMemoryBarrier = 等待所有 groupshared 内存访问完成。
GroupMemoryBarrierWithGroupSync = 同 GroupMemoryBarrier，并且等待组内所有线程都执行到这里：写入和读取 groupshared 数据之间常用的屏障。

# 原子操作
InterlockedAdd = 原子地把 value 加到 dest 上，dest 是 groupshared 变量或 UAV 的元素。originalValue 得到相加前的值。
InterlockedAnd = 原子地对 dest 和 value 做按位与。originalValue 得到原值。
InterlockedOr = 原子地对 dest 和 value 做按位或。originalValue 得到原值。
InterlockedXor = 原子地对 dest 和 value 做按位异或。originalValue 得到原值。
InterlockedMin = 原子地把 dest 和 value 中较小者写入 dest。originalValue 得到原值。
InterlockedMax = 原子地把 dest 和 value 中较大者写入 dest。originalValue 得到原值。
InterlockedExchange = 原子地把 value 写入 dest；originalValue 得到原值。
InterlockedCompareExchange = 当 dest 等于 compareValue 时，原子地把 value 写入 dest。无论是否写入，originalValue 都得到原值。
InterlockedCompareStore = 同 InterlockedCompareExchange，但不返回原值。

# Wave 操作
WaveIsFirstLane = 在 wave 中恰好一个活动通道返回 true：索引最小的那个。
WaveGetLaneCount = 当前硬件上一个 wave 的通道数。
WaveGetLaneIndex = 当前通道在所属 wave 中的索引。
WaveActiveAllEqual = 所有活动通道的 value 都相同时为 true。
WaveActiveCountBits = bit 为 true 的活动通道数。
WaveActiveSum = 所有活动通道 value 之和。
WaveActiveProduct = 所有活动通道 value 之积。
WaveActiveMin = 所有活动通道 value 的最小值。
WaveActiveMax = 所有活动通道 value 的最大值。
WaveActiveBitAnd = 所有活动通道 value 的按位与。
WaveActiveBitOr = 所有活动通道 value 的按位或。
WaveActiveBitXor = 所有活动通道 value 的按位异或。
WavePrefixCountBits = 索引比当前通道小、且 bit 为 true 的活动通道数。
WavePrefixSum = 索引比当前通道小的活动通道 value 之和（不含自身的前缀和）。
WavePrefixProduct = 索引比当前通道小的活动通道 value 之积（不含自身的前缀积）。
WaveReadLaneAt = 读取第 laneIndex 号通道的 value。
WaveReadLaneFirst = 读取第一个活动通道的 value。

# 曲面细分
ProcessIsolineTessFactors = 对等值线（isoline）面片的细分因子做舍入和限制。仅限外壳着色器。
ProcessTriTessFactorsAvg = 对三角形面片的细分因子做舍入。内部因子取各边因子的平均值，再乘以 insideScale。
ProcessTriTessFactorsMax = 对三角形面片的细分因子做舍入。内部因子取各边因子的最大值，再乘以 insideScale。
ProcessTriTessFactorsMin = 对三角形面片的细分因子做舍入。内部因子取各边因子的最小值，再乘以 insideScale。
ProcessQuadTessFactorsAvg = 对四边形面片的细分因子做舍入。内部因子取各边因子的平均值，再乘以 insideScale。
ProcessQuadTessFactorsMax = 对四边形面片的细分因子做舍入。内部因子取各边因子的最大值，再乘以 insideScale。
ProcessQuadTessFactorsMin = 对四边形面片的细分因子做舍入。内部因子取各边因子的最小值，再乘以 insideScale。
Process2DQuadTessFactorsAvg = 对四边形面片的细分因子做舍入，两个方向的内部因子分别由对应各边的平均值算出。
Process2DQuadTessFactorsMax = 对四边形面片的细分因子做舍入，两个方向的内部因子分别由对应各边的最大值算出。
Process2DQuadTessFactorsMin = 对四边形面片的细分因子做舍入，两个方向的内部因子分别由对应各边的最小值算出。

# 光线追踪
TraceRay = 向加速结构发射一条光线。随后运行的命中、任意命中和未命中着色器读写 payload。
ReportHit = 在相交着色器中报告距离为 tHit 的命中。命中被接受时返回 true。
CallShader = 调用着色器表中 shaderIndex 处的可调用着色器。
IgnoreHit = 在任意命中着色器中拒绝当前命中，继续遍历。
AcceptHitAndEndSearch = 在任意命中着色器中接受当前命中并结束遍历。
DispatchRaysIndex = 当前光线在 DispatchRays 网格中的索引。
DispatchRaysDimensions = DispatchRays 网格的尺寸。
WorldRayOrigin = 当前光线在世界空间中的起点。
WorldRayDirection = 当前光线在世界空间中的方向。
ObjectRayOrigin = 当前光线在当前实例物体空间中的起点。
ObjectRayDirection = 当前光线在当前实例物体空间中的方向。
RayTMin = 当前光线区间的起点。
RayTCurrent = 当前光线区间目前的终点：目前为止最近的已接受命中，或 TMax。
RayFlags = 发射当前光线时使用的标志。
InstanceIndex = 当前实例在顶层加速结构中的索引。
InstanceID = 当前实例的用户自定义 InstanceID。
PrimitiveIndex = 当前图元在其几何体中的索引。
HitKind = 当前命中的类型：三角形的正面或背面，或相交着色器传给 ReportHit 的值。
ObjectToWorld3x4 = 物体空间到世界空间的变换，3x4 矩阵。
ObjectToWorld4x3 = 物体空间到世界空间的变换，4x3 矩阵。
WorldToObject3x4 = 世界空间到物体空间的变换，3x4 矩阵。
WorldToObject4x3 = 世界空间到物体空间的变换，4x3 矩阵。

# 调试
printf = 向 PIX 等工具的调试输出写入格式化文本，其他情况下被忽略。

# Direct3D 9 旧式采样
tex1D = 采样一维纹理（Direct3D 9 旧语法）。
tex1Dbias = 采样一维纹理，mip 级别加上 t.w 的偏移。
tex1Dgrad = 用显式梯度采样一维纹理。
tex1Dlod = 在 t.w 指定的 mip 级别采样一维纹理。
tex1Dproj = 用 t 除以 t.w 之后的坐标采样一维纹理。
tex2D = 采样二维纹理（Direct3D 9 旧语法）。
tex2Dbias = 采样二维纹理，mip 级别加上 t.w 的偏移。
tex2Dgrad = 用显式梯度采样二维纹理。
tex2Dlod = 在 t.w 指定的 mip 级别采样二维纹理。
tex2Dproj = 用 t 除以 t.w 之后的坐标采样二维纹理。
tex3D = 采样体积纹理（Direct3D 9 旧语法）。
tex3Dbias = 采样体积纹理，mip 级别加上 t.w 的偏移。
tex3Dgrad = 用显式梯度采样体积纹理。
tex3Dlod = 在 t.w 指定的 mip 级别采样体积纹理。
tex3Dproj = 用 t 除以 t.w 之后的坐标采样体积纹理。
texCUBE = 采样立方体贴图（Direct3D 9 旧语法）。
texCUBEbias = 采样立方体贴图，mip 级别加上 t.w 的偏移。
texCUBEgrad = 用显式梯度采样立方体贴图。
texCUBElod = 在 t.w 指定的 mip 级别采样立方体贴图。
texCUBEproj = 用 t 除以 t.w 之后的坐标采样立方体贴图。

# 属性
numthreads = 计算、网格或放大着色器一个线程组里的线程数，分别对应 x、y、z 三个方向。Dispatch(X, Y, Z) 会启动 X * Y * Z 个这样的线程组，并且 SV_DispatchThreadID = SV_GroupID * (x, y, z) + SV_GroupThreadID。每组最多 1024 个线程，z 最大为 64。
WaveSize = 计算着色器要求的 wave 大小，以通道数计（Shader Model 6.6）。只在 wave 大小与之相同的硬件上运行。
shader = 把着色器库中的函数标记为指定阶段的入口点，比如 "compute"、"pixel"、"raygeneration" 或 "closesthit"。
RootSignature = 编译进着色器的根签名，用根签名语言书写。通常写成一个保存该字符串的宏。
earlydepthstencil = 强制在像素着色器之前执行深度和模板测试，未通过测试的像素不会执行着色。
maxvertexcount = 几何着色器一次调用最多输出的顶点数。
instance = 几何着色器对每个图元运行的次数；用 SV_GSInstanceID 区分各次实例。
domain = 外壳或域着色器的面片类型："tri"、"quad" 或 "isoline"。
partitioning = 细分器划分面片的方式："integer"、"fractional_even"、"fractional_odd" 或 "pow2"。
outputtopology = 细分器或网格着色器输出的图元：外壳着色器之后为 "point"、"line"、"triangle_cw" 或 "triangle_ccw"，网格着色器为 "line" 或 "triangle"。
outputcontrolpoints = 外壳着色器输出的控制点数，也就是它对每个面片运行的次数。
patchconstantfunc = 计算外壳着色器面片常量（比如细分因子）的函数名。
maxtessfactor = 外壳着色器返回的细分因子的上限。
clipplanes = 供 Direct3D 9 级硬件（vs_4_0_level_9_x 配置）使用的用户裁剪平面，以 float4 平面方程给出。
unroll = 把循环一直展开到它结束为止。可选参数是最多展开的迭代次数。
loop = 保持为真正的循环，不展开。
fastopt = 缩短循环的编译时间，代价是优化不那么激进。
allow_uav_condition = 允许计算着色器的循环条件依赖于 UAV 读取的值。循环内不能包含同步函数。
branch = 把 if 或 switch 编译成真正的分支，只执行被选中的那一侧。
flatten = 两侧都执行，再选择结果，不产生分支。
forcecase = 把 switch 编译成着色器代码中真正的 switch 语句。
call = 把 switch 各个 case 的代码编译成子程序，让 case 很多的 switch 保持较小体积。
