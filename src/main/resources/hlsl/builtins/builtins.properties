# Descriptions of the HLSL intrinsic functions and built-in types, shown on hover and written above each
# declaration of the generated built-ins file. English is the default bundle; builtins_zh.properties holds the
# Chinese text. The declarations themselves are in builtins.hlsl.

header = Built-in functions and types of HLSL. The compiler provides them; this file only declares them so that\n\
  hover and Go to Declaration have something to show. It is generated by the HLSL plugin and read-only.\n\
  T stands for a scalar, vector or matrix type. Overloads that take an offset or a status argument are left out.
kind.function = intrinsic function
kind.type = built-in type

# Textures
Texture1D = Read-only 1D texture, bound to a t register. T is the type Sample and Load return, float4 when omitted.
Texture1DArray = Read-only array of 1D textures, bound to a t register. The last coordinate component is the array slice.
Texture2D = Read-only 2D texture, bound to a t register. Sampled through a SamplerState, or read texel by texel with Load and [].
Texture2DArray = Read-only array of 2D textures, bound to a t register. The last coordinate component is the array slice.
Texture3D = Read-only volume texture, bound to a t register.
TextureCube = Read-only cube map, bound to a t register. It is sampled with a direction vector rather than a texture coordinate.
TextureCubeArray = Read-only array of cube maps, bound to a t register. The fourth coordinate component selects the cube.
Texture2DMS = Read-only multisampled 2D texture, bound to a t register. It cannot be sampled; each sample is read with Load.
Texture2DMSArray = Read-only array of multisampled 2D textures, bound to a t register. Each sample is read with Load.
RWTexture1D = Read-write 1D texture (unordered access view), bound to a u register. Texels are read and written with [].
RWTexture1DArray = Read-write array of 1D textures (unordered access view), bound to a u register.
RWTexture2D = Read-write 2D texture (unordered access view), bound to a u register. Texels are read and written with []; it cannot be sampled, and atomics go through the Interlocked functions.
RWTexture2DArray = Read-write array of 2D textures (unordered access view), bound to a u register.
RWTexture3D = Read-write volume texture (unordered access view), bound to a u register.

# Buffers
Buffer = Read-only typed buffer, bound to a t register. Each element is converted from the view's format to T.
RWBuffer = Read-write typed buffer (unordered access view), bound to a u register.
StructuredBuffer = Read-only buffer of structures of type T, bound to a t register.
RWStructuredBuffer = Read-write buffer of structures of type T (unordered access view), bound to a u register. It can carry a hidden counter.
AppendStructuredBuffer = Write-only structured buffer used as a stack: Append pushes an element. Bound to a u register.
ConsumeStructuredBuffer = Structured buffer used as a stack that is read from: Consume pops an element. Bound to a u register.
ByteAddressBuffer = Read-only raw buffer addressed in bytes, bound to a t register. Addresses must be multiples of 4.
RWByteAddressBuffer = Read-write raw buffer addressed in bytes (unordered access view), bound to a u register. Supports atomic operations on 32-bit words.
ConstantBuffer = Constant buffer whose layout is the structure T, bound to a b register. Its members are read directly, without a cbuffer block.

# Samplers and other objects
SamplerState = Sampler that describes filtering and addressing for texture sampling, bound to an s register.
SamplerComparisonState = Comparison sampler for SampleCmp and GatherCmp, typically used for shadow maps. Bound to an s register.
InputPatch = The control points a hull shader receives for one patch; ControlPointCount is the patch size.
OutputPatch = The control points a hull shader produced, as the patch constant function and the domain shader see them.
PointStream = Output stream of a geometry shader that emits points.
LineStream = Output stream of a geometry shader that emits line strips. RestartStrip starts a new strip.
TriangleStream = Output stream of a geometry shader that emits triangle strips. RestartStrip starts a new strip.
RaytracingAccelerationStructure = Top-level ray tracing acceleration structure, bound to a t register and passed to TraceRay.
RayDesc = A ray: its origin, its direction and the interval [TMin, TMax] along it in which hits are accepted.
RayQuery = Inline ray tracing query (shader model 6.5): traces a ray from any shader stage and walks its candidate hits with Proceed.
ResourceDescriptorHeap = The shader-visible descriptor heap of resources (shader model 6.6). Indexing it gives a resource without a register binding.
SamplerDescriptorHeap = The shader-visible descriptor heap of samplers (shader model 6.6). Indexing it gives a sampler without a register binding.
vector = Generic vector type: vector<float, 4> is float4. Without template arguments it is float4.
matrix = Generic matrix type: matrix<float, 4, 4> is float4x4. Without template arguments it is float4x4.
sampler = Legacy Direct3D 9 sampler type, used with the tex* functions.
sampler1D = Legacy Direct3D 9 sampler for a 1D texture, used with tex1D.
sampler2D = Legacy Direct3D 9 sampler for a 2D texture, used with tex2D.
sampler3D = Legacy Direct3D 9 sampler for a volume texture, used with tex3D.
samplerCUBE = Legacy Direct3D 9 sampler for a cube map, used with texCUBE.
texture = Legacy Direct3D 9 effect texture, bound to a sampler in an effect file.

# Math
abs = Absolute value, per component.
acos = Arccosine, per component, in radians.
asin = Arcsine, per component, in radians.
atan = Arctangent, per component, in radians.
atan2 = Arctangent of y / x, using the signs of both to find the quadrant. The result is in [-pi, pi].
cos = Cosine of an angle in radians, per component.
cosh = Hyperbolic cosine, per component.
sin = Sine of an angle in radians, per component.
sinh = Hyperbolic sine, per component.
sincos = Sine and cosine of x at once, written to s and c.
tan = Tangent of an angle in radians, per component.
tanh = Hyperbolic tangent, per component.
degrees = Converts radians to degrees.
radians = Converts degrees to radians.
ceil = Rounds up to the nearest integer value, per component.
floor = Rounds down to the nearest integer value, per component.
round = Rounds to the nearest integer value, per component.
trunc = Drops the fractional part, rounding towards zero.
frac = Fractional part, x - floor(x), per component.
fmod = Floating-point remainder of x / y, with the sign of x.
modf = Splits x into its fractional part, returned, and its integer part, written to integerPart. Both keep the sign of x.
frexp = Splits x into a mantissa, returned, and a power-of-two exponent, written to exponent.
ldexp = x * 2^exponent.
exp = e raised to the power x.
exp2 = 2 raised to the power x.
log = Natural logarithm.
log10 = Base-10 logarithm.
log2 = Base-2 logarithm.
pow = x raised to the power y. The result is undefined for a negative x.
sqrt = Square root, per component.
rsqrt = Reciprocal square root, 1 / sqrt(x).
rcp = Fast approximate reciprocal, 1 / x.
min = The smaller of x and y, per component.
max = The larger of x and y, per component.
clamp = Clamps x to [min, max], per component.
saturate = Clamps x to [0, 1], per component.
sign = -1, 0 or 1 by the sign of x, per component, as int.
lerp = Linear interpolation x + s * (y - x): s = 0 gives x and s = 1 gives y.
smoothstep = Smooth Hermite interpolation from 0 to 1 as x goes from min to max.
step = 1 where x >= y, otherwise 0, per component.
mad = m * a + b, as a single multiply-add instruction.
fma = Fused multiply-add of doubles: a * b + c with a single rounding.
all = True when every component of x is non-zero.
any = True when any component of x is non-zero.
isfinite = True per component where x is neither infinite nor NaN.
isinf = True per component where x is positive or negative infinity.
isnan = True per component where x is NaN.

# Vectors and matrices
dot = Dot product of two vectors.
cross = Cross product of two 3-component vectors.
length = Length of a vector.
distance = Distance between two points.
normalize = The vector scaled to length 1.
reflect = Reflection of the incident vector i about the surface normal n.
refract = Refraction of the incident vector i through a surface with normal n and ratio of refraction indices eta. Zero on total internal reflection.
faceforward = -n * sign(dot(i, ng)): flips n so that it faces against the incident vector.
mul = Matrix multiplication. A vector on the left is a row vector, a vector on the right a column vector.
determinant = Determinant of a square matrix.
transpose = Transpose of a matrix: rows become columns.
dst = Distance vector for legacy lighting: (1, a.y * b.y, a.z, b.w).
lit = Legacy lighting coefficients (ambient, diffuse, specular, 1) from n.l, n.h and the specular exponent m.
noise = Perlin noise. Only legacy effect texture shaders can use it; compiled shaders cannot.

# Bits and conversions
asfloat = Reinterprets the bits of x as float, without converting the value.
asint = Reinterprets the bits of x as int, without converting the value.
asuint = Reinterprets the bits of x as uint. The double overload splits the value into its two 32-bit halves.
asdouble = Builds a double from its two 32-bit halves.
f16tof32 = Converts the half-precision float in the low 16 bits of value to float.
f32tof16 = Converts a float to half precision, stored in the low 16 bits of the result.
D3DCOLORtoUBYTE4 = Converts a float4 color to the 4 bytes of the legacy D3DCOLOR (UBYTE4) vertex format, swizzled as Direct3D 9 did.
countbits = Number of bits that are set, per component.
reversebits = Reverses the order of the bits, per component: bit 0 becomes bit 31.
firstbithigh = Index of the highest set bit, counted from bit 0; for a negative int, the highest clear bit. -1 (0xFFFFFFFF) when there is none.
firstbitlow = Index of the lowest set bit. -1 (0xFFFFFFFF) when value is 0.
msad4 = Masked sum of absolute differences of a 4-byte reference against four byte windows of source, added to accumulator. Zero bytes of the reference are skipped.

# Pixel shader
clip = Discards the pixel when any component of x is negative.
ddx = Rate of change of x along the screen x direction. Pixel shaders only.
ddx_coarse = Coarse ddx: one value for each 2x2 pixel quad.
ddx_fine = Fine ddx: computed for each pair of pixels within the 2x2 quad.
ddy = Rate of change of x along the screen y direction. Pixel shaders only.
ddy_coarse = Coarse ddy: one value for each 2x2 pixel quad.
ddy_fine = Fine ddy: computed for each pair of pixels within the 2x2 quad.
fwidth = abs(ddx(x)) + abs(ddy(x)), the screen-space change of x, commonly used for antialiasing.
EvaluateAttributeAtCentroid = Evaluates an input attribute at the centroid of the pixel. Pixel shaders only.
EvaluateAttributeAtSample = Evaluates an input attribute at the given sample of the pixel.
EvaluateAttributeSnapped = Evaluates an input attribute at the pixel center moved by offset, in steps of 1/16 pixel.
GetRenderTargetSampleCount = Number of samples of the bound render target.
GetRenderTargetSamplePosition = Position of the given sample within the pixel.

# Synchronization
AllMemoryBarrier = Waits until all memory accesses of the group, device memory and group-shared memory alike, are complete.
AllMemoryBarrierWithGroupSync = As AllMemoryBarrier, and also waits until every thread of the group reaches this call.
DeviceMemoryBarrier = Waits until all device memory accesses, to buffers and textures, are complete.
DeviceMemoryBarrierWithGroupSync = As DeviceMemoryBarrier, and also waits until every thread of the group reaches this call.
GroupMemoryBarrier = Waits until all group-shared memory accesses are complete.
GroupMemoryBarrierWithGroupSync = As GroupMemoryBarrier, and also waits until every thread of the group reaches this call: the usual barrier between writing and reading groupshared data.

# Atomics
InterlockedAdd = Atomically adds value to dest, a groupshared variable or an element of a UAV. originalValue receives the value before the addition.
InterlockedAnd = Atomically ANDs value into dest. originalValue receives the previous value.
InterlockedOr = Atomically ORs value into dest. originalValue receives the previous value.
InterlockedXor = Atomically XORs value into dest. originalValue receives the previous value.
InterlockedMin = Atomically stores the smaller of dest and value. originalValue receives the previous value.
InterlockedMax = Atomically stores the larger of dest and value. originalValue receives the previous value.
InterlockedExchange = Atomically stores value into dest; originalValue receives the previous value.
InterlockedCompareExchange = Atomically stores value into dest when dest equals compareValue. originalValue receives the previous value either way.
InterlockedCompareStore = As InterlockedCompareExchange, without returning the previous value.

# Wave operations
WaveIsFirstLane = True in exactly one active lane of the wave: the one with the lowest index.
WaveGetLaneCount = Number of lanes in a wave on this hardware.
WaveGetLaneIndex = Index of the current lane within its wave.
WaveActiveAllEqual = True when value is the same in every active lane.
WaveActiveCountBits = Number of active lanes in which bit is true.
WaveActiveSum = Sum of value over all active lanes.
WaveActiveProduct = Product of value over all active lanes.
WaveActiveMin = Minimum of value over all active lanes.
WaveActiveMax = Maximum of value over all active lanes.
WaveActiveBitAnd = Bitwise AND of value over all active lanes.
WaveActiveBitOr = Bitwise OR of value over all active lanes.
WaveActiveBitXor = Bitwise XOR of value over all active lanes.
WavePrefixCountBits = Number of active lanes with a lower index than this one in which bit is true.
WavePrefixSum = Sum of value over the active lanes with a lower index than this one (an exclusive prefix sum).
WavePrefixProduct = Product of value over the active lanes with a lower index than this one (an exclusive prefix product).
WaveReadLaneAt = value as seen by lane laneIndex.
WaveReadLaneFirst = value as seen by the first active lane.

# Tessellation
ProcessIsolineTessFactors = Rounds and clamps the tessellation factors of an isoline patch. Hull shaders only.
ProcessTriTessFactorsAvg = Rounds the tessellation factors of a triangle patch. The inside factor is the average of the edge factors, scaled by insideScale.
ProcessTriTessFactorsMax = Rounds the tessellation factors of a triangle patch. The inside factor is the largest edge factor, scaled by insideScale.
ProcessTriTessFactorsMin = Rounds the tessellation factors of a triangle patch. The inside factor is the smallest edge factor, scaled by insideScale.
ProcessQuadTessFactorsAvg = Rounds the tessellation factors of a quad patch. The inside factors are the average of the edge factors, scaled by insideScale.
ProcessQuadTessFactorsMax = Rounds the tessellation factors of a quad patch. The inside factors are the largest edge factor, scaled by insideScale.
ProcessQuadTessFactorsMin = Rounds the tessellation factors of a quad patch. The inside factors are the smallest edge factor, scaled by insideScale.
Process2DQuadTessFactorsAvg = Rounds the tessellation factors of a quad patch, with the inside factors of the two axes computed separately from the average of their edges.
Process2DQuadTessFactorsMax = Rounds the tessellation factors of a quad patch, with the inside factors of the two axes computed separately from the largest of their edges.
Process2DQuadTessFactorsMin = Rounds the tessellation factors of a quad patch, with the inside factors of the two axes computed separately from the smallest of their edges.

# Ray tracing
TraceRay = Traces a ray into the acceleration structure. The hit, any-hit and miss shaders that run read and write payload.
ReportHit = Reports a hit at distance tHit from an intersection shader. Returns true when the hit is accepted.
CallShader = Calls the callable shader at shaderIndex in the shader table.
IgnoreHit = Rejects the current hit in an any-hit shader and continues the traversal.
AcceptHitAndEndSearch = Accepts the current hit in an any-hit shader and stops the traversal.
DispatchRaysIndex = Index of the current ray in the DispatchRays grid.
DispatchRaysDimensions = Size of the DispatchRays grid.
WorldRayOrigin = Origin of the current ray in world space.
WorldRayDirection = Direction of the current ray in world space.
ObjectRayOrigin = Origin of the current ray in the object space of the current instance.
ObjectRayDirection = Direction of the current ray in the object space of the current instance.
RayTMin = Start of the interval of the current ray.
RayTCurrent = Current end of the interval of the current ray: the closest hit accepted so far, or TMax.
RayFlags = The flags the current ray was traced with.
InstanceIndex = Index of the current instance in the top-level acceleration structure.
InstanceID = The user-defined InstanceID of the current instance.
PrimitiveIndex = Index of the current primitive within its geometry.
HitKind = The kind of the current hit: the front or back face of a triangle, or the value an intersection shader gave ReportHit.
ObjectToWorld3x4 = Transform from object space to world space, as a 3x4 matrix.
ObjectToWorld4x3 = Transform from object space to world space, as a 4x3 matrix.
WorldToObject3x4 = Transform from world space to object space, as a 3x4 matrix.
WorldToObject4x3 = Transform from world space to object space, as a 4x3 matrix.

# Debugging
printf = Writes formatted text to the debug output of tools such as PIX. Ignored otherwise.

# Legacy Direct3D 9 sampling
tex1D = Samples a 1D texture (legacy Direct3D 9 syntax).
tex1Dbias = Samples a 1D texture with the mip level biased by t.w.
tex1Dgrad = Samples a 1D texture with explicit gradients.
tex1Dlod = Samples a 1D texture at the mip level t.w.
tex1Dproj = Samples a 1D texture after dividing t by t.w.
tex2D = Samples a 2D texture (legacy Direct3D 9 syntax).
tex2Dbias = Samples a 2D texture with the mip level biased by t.w.
tex2Dgrad = Samples a 2D texture with explicit gradients.
tex2Dlod = Samples a 2D texture at the mip level t.w.
tex2Dproj = Samples a 2D texture after dividing t by t.w.
tex3D = Samples a volume texture (legacy Direct3D 9 syntax).
tex3Dbias = Samples a volume texture with the mip level biased by t.w.
tex3Dgrad = Samples a volume texture with explicit gradients.
tex3Dlod = Samples a volume texture at the mip level t.w.
tex3Dproj = Samples a volume texture after dividing t by t.w.
texCUBE = Samples a cube map (legacy Direct3D 9 syntax).
texCUBEbias = Samples a cube map with the mip level biased by t.w.
texCUBEgrad = Samples a cube map with explicit gradients.
texCUBElod = Samples a cube map at the mip level t.w.
texCUBEproj = Samples a cube map after dividing t by t.w.
