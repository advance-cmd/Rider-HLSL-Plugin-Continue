# HLSL 语义（semantics）与插值修饰符的中文说明，鼠标悬停时显示。
# 英文原文在 semantics.properties。

kind.system_value = 系统语义
kind.parameter = 阶段间传值
kind.interpolation = 插值修饰符
kind.register = 绑定位置

SV_Target = 渲染目标输出。该值写入同一槽位 register 绑定的那个渲染目标。
SV_Target0 = 渲染目标输出 0。该值写入第 1 个绑定的渲染目标。
SV_Target1 = 渲染目标输出 1。该值写入第 2 个绑定的渲染目标。
SV_Target2 = 渲染目标输出 2。该值写入第 3 个绑定的渲染目标。
SV_Target3 = 渲染目标输出 3。该值写入第 4 个绑定的渲染目标。
SV_Target4 = 渲染目标输出 4。该值写入第 5 个绑定的渲染目标。
SV_Target5 = 渲染目标输出 5。该值写入第 6 个绑定的渲染目标。
SV_Target6 = 渲染目标输出 6。该值写入第 7 个绑定的渲染目标。
SV_Target7 = 渲染目标输出 7。该值写入第 8 个绑定的渲染目标。
SV_Position = 裁剪空间位置。在像素着色器里表示该像素在屏幕上的位置。
SV_ClipDistance = 用于裁剪的距离。负值会在光栅化之前被裁掉。
SV_CullDistance = 用于剔除的距离。负值会丢弃整个图元。
SV_Depth = 像素着色器写出的片元深度，取代光栅化器自己算出的深度。
SV_DepthGreaterEqual = 片元深度，只有大于等于深度缓冲里的值时才保留。
SV_DepthLessEqual = 片元深度，只有小于等于深度缓冲里的值时才保留。
SV_Coverage = 该片元的采样覆盖掩码。
SV_IsFrontFace = 三角形是否正面朝向相机。
SV_VertexID = 顶点着色器正在处理的顶点索引。
SV_InstanceID = 正在处理的实例索引。
SV_PrimitiveID = 图元索引，在几何或像素着色器里逐图元递增。
SV_RenderTargetArrayIndex = 纹理数组里该图元写入的层。
SV_ViewportArrayIndex = 该图元写入的视口。
SV_ViewID = 渲染到多视图纹理时的视图索引。
SV_Barycentrics = 该像素的重心坐标。
SV_StencilRef = 像素着色器写出的模板参考值。
SV_InnerCoverage = 完全落在图元内部的采样覆盖情况。

SV_DispatchThreadID = 整个 Dispatch 的全局线程索引，跨所有线程组。
SV_GroupID = 该线程组在 Dispatch 中的索引。
SV_GroupThreadID = 线程在自己所属线程组内的索引。
SV_GroupIndex = 线程在自己所属线程组内的展平索引。
SV_DomainLocation = 面片内的位置，以细分权重表示。
SV_OutputControlPointID = 外壳着色器正在处理的轮廓点索引。
SV_TessFactor = 面片各边的细分因子。
SV_InsideTessFactor = 面片内部的细分因子。

POSITION = 物体空间或裁剪空间的位置，取决于声明它的是哪个阶段。
TEXCOORD = 从上一阶段传到下一阶段的纹理坐标。
TEXCOORD0 = 第 0 组纹理坐标，从上一阶段传到下一阶段。
TEXCOORD1 = 第 1 组纹理坐标，从上一阶段传到下一阶段。
TEXCOORD2 = 第 2 组纹理坐标，从上一阶段传到下一阶段。
TEXCOORD3 = 第 3 组纹理坐标，从上一阶段传到下一阶段。
COLOR = 从上一阶段传到下一阶段的颜色。
COLOR0 = 第 0 组颜色，从上一阶段传到下一阶段。
COLOR1 = 第 1 组颜色，从上一阶段传到下一阶段。
NORMAL = 从上一阶段传到下一阶段的法线。
TANGENT = 从上一阶段传到下一阶段的切线。
BINORMAL = 从上一阶段传到下一阶段的副法线。
BLENDINDICES = 蒙皮用的骨骼索引。
BLENDWEIGHT = 蒙皮用的骨骼权重。
PSIZE = 点精灵的点尺寸。
FOG = 从顶点阶段传到像素阶段的雾浓度。
VFACE = SV_IsFrontFace 的旧名字。
VPOS = 像素着色器里 SV_Position 的旧名字。
DEPTH = SV_Depth 的旧名字。

linear = 在图元顶点之间做线性插值。
centroid = 在覆盖区域内的某一点采样插值结果，而不是在像素中心。
nointerpolation = 不做插值，图元内每个像素都用触发顶点的值。
noperspective = 在屏幕空间插值，不做透视校正。
sample = 按采样点插值而不是按像素，用于多重采样。

register = 资源或常量缓冲在管线中的绑定槽位，例如 register(b0)、register(t0)。
