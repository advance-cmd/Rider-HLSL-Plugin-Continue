# Descriptions of the HLSL semantics and interpolation modifiers, shown on hover.
# English is the default bundle; semantics_zh.properties holds the Chinese text.

kind.system_value = system value
kind.parameter = vertex-to-pixel value
kind.interpolation = interpolation modifier
kind.register = binding

SV_Target = Render target output. The value is written to the target bound at the register in the same slot.
SV_Target0 = Render target output 0. The value is written to the first bound render target.
SV_Target1 = Render target output 1. The value is written to the second bound render target.
SV_Target2 = Render target output 2. The value is written to the third bound render target.
SV_Target3 = Render target output 3. The value is written to the fourth bound render target.
SV_Target4 = Render target output 4. The value is written to the fifth bound render target.
SV_Target5 = Render target output 5. The value is written to the sixth bound render target.
SV_Target6 = Render target output 6. The value is written to the seventh bound render target.
SV_Target7 = Render target output 7. The value is written to the eighth bound render target.
SV_Position = Position in clip space. In a pixel shader it holds the screen position of the pixel.
SV_ClipDistance = Distance used for clipping. Negative values are cut away before rasterization.
SV_CullDistance = Distance used for culling. Negative values drop the primitive.
SV_Depth = Fragment depth written by a pixel shader, instead of the depth the rasterizer computed.
SV_DepthGreaterEqual = Fragment depth, kept only when it is greater than or equal to the depth in the buffer.
SV_DepthLessEqual = Fragment depth, kept only when it is less than or equal to the depth in the buffer.
SV_Coverage = Sample coverage mask of the fragment.
SV_IsFrontFace = True when the triangle faces the camera.
SV_VertexID = Index of the vertex the vertex shader is running for.
SV_InstanceID = Index of the instance the shader is running for.
SV_PrimitiveID = Index of the primitive, per primitive in the geometry or pixel shader.
SV_RenderTargetArrayIndex = Array slice the primitive is written to in a texture array.
SV_ViewportArrayIndex = Viewport the primitive is written to.
SV_ViewID = Index of the view when rendering to a multiview texture.
SV_Barycentrics = Barycentric coordinates of the pixel.
SV_StencilRef = Stencil reference value written by a pixel shader.
SV_InnerCoverage = Coverage of samples that are completely inside the primitive.

SV_DispatchThreadID = Global thread index in the dispatch, across all thread groups.
SV_GroupID = Index of the thread group inside the dispatch.
SV_GroupThreadID = Thread index inside its own thread group.
SV_GroupIndex = Flattened thread index inside its own thread group.
SV_DomainLocation = Position inside the patch, as tessellation weights.
SV_OutputControlPointID = Index of the control point a hull shader is running for.
SV_TessFactor = Edge tessellation factors of the patch.
SV_InsideTessFactor = Interior tessellation factors of the patch.

POSITION = Object or clip space position, depending on the stage that declares it.
TEXCOORD = Texture coordinate passed from one stage to the next.
TEXCOORD0 = Texture coordinate set 0, passed from one stage to the next.
TEXCOORD1 = Texture coordinate set 1, passed from one stage to the next.
TEXCOORD2 = Texture coordinate set 2, passed from one stage to the next.
TEXCOORD3 = Texture coordinate set 3, passed from one stage to the next.
COLOR = Colour passed from one stage to the next.
COLOR0 = Colour set 0, passed from one stage to the next.
COLOR1 = Colour set 1, passed from one stage to the next.
NORMAL = Normal vector passed from one stage to the next.
TANGENT = Tangent vector passed from one stage to the next.
BINORMAL = Binormal vector passed from one stage to the next.
BLENDINDICES = Bone indices used for skinning.
BLENDWEIGHT = Bone weights used for skinning.
PSIZE = Point size of a point sprite.
FOG = Fog amount passed from the vertex to the pixel stage.
VFACE = Legacy name of SV_IsFrontFace.
VPOS = Legacy name of SV_Position in a pixel shader.
DEPTH = Legacy name of SV_Depth.

linear = Interpolate the value linearly between the vertices of the primitive.
centroid = Sample the interpolated value at a point inside the covered area, not at the pixel centre.
nointerpolation = Do not interpolate; every pixel of the primitive gets the value from the provoking vertex.
noperspective = Interpolate in screen space, ignoring perspective correction.
sample = Interpolate per sample instead of per pixel, for use with multisampling.

register = Pipeline slot a resource or constant buffer is bound to, for example register(b0) or register(t0).
